[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-clean"
version = "0.1.0"
description = "AI-powered repository cleanup tool using Claude Code"
requires-python = ">=3.12"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
repo-clean = "repo_clean.main:main"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]

[tool.setuptools.package-data]
repo_clean = ["data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
